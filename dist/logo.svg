<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="100%" height="100%">
  <style>
    .font-sub { font-family: 'DM Serif Display', 'Georgia', serif; font-size: 21px; fill: #175475; letter-spacing: 4.5px; font-weight: 600; }
    .font-[#175475] { fill: #175475; }
    .font-gold { fill: #f1a823; }
    .font-purple { fill: #884e9d; }
    .font-green { fill: #48a053; }
    .font-red { fill: #dc3c39; }
  </style>
  
  <!-- iM Lettering with Person Silhouette -->
  <g transform="translate(35, 75)">
    <!-- i Body & Arm -->
    <circle cx="24" cy="22" r="10" fill="#175475"/>
    <path d="M 22,38 C 22,38 38,20 48,12 C 50,10 52,14 47,19 C 38,28 28,48 28,68 L 28,120 L 14,120 L 14,50 C 14,43 18,38 22,38 Z" fill="#175475"/>
    <!-- M Letter -->
    <path d="M 62,38 L 82,38 L 108,86 L 134,38 L 154,38 L 154,120 L 132,120 L 132,68 L 114,104 L 102,104 L 84,68 L 84,120 L 62,120 Z" fill="#175475"/>
    <!-- Dash -->
    <rect x="168" y="72" width="22" height="14" rx="2" fill="#175475"/>
  </g>

  <!-- P Lettering with Podium Silhouette -->
  <g transform="translate(235, 65)">
    <!-- Main P Loop -->
    <path d="M 10,12 C 10,12 85,-15 105,45 C 120,95 65,110 45,95 L 45,130 L 25,130 L 25,25 C 20,18 10,12 10,12 Z" fill="none" stroke="#f1a823" stroke-width="26" stroke-linecap="round"/>
    
    <!-- Podium & Speaker Silhouette -->
    <!-- Speaker Head -->
    <circle cx="52" cy="40" r="9" fill="#f1a823"/>
    <!-- Speaker Body & Raised Arm -->
    <path d="M 48,53 C 48,53 62,40 70,35 C 72,33 74,36 70,40 C 63,47 55,60 55,75 L 38,75 C 38,62 43,55 48,53 Z" fill="#f1a823"/>
    <!-- Mic Stand -->
    <path d="M 28,58 L 36,46 M 30,55 L 40,55" stroke="#f1a823" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Podium Stand -->
    <path d="M 22,70 L 68,70 L 60,135 L 30,135 Z" fill="#f1a823"/>
    <path d="M 18,65 L 72,65 L 72,70 L 18,70 Z" fill="#f1a823"/>
  </g>

  <!-- ACT Lettering -->
  <g transform="translate(340, 75)">
    <!-- A (Purple) -->
    <path d="M 40,120 L 18,120 L 45,38 L 75,38 L 102,120 L 80,120 L 73,98 L 47,98 Z M 52,80 L 68,80 L 60,54 Z" fill="#884e9d"/>
    <!-- C (Green) -->
    <path d="M 175,65 C 168,48 152,36 132,36 C 104,36 84,58 84,80 C 84,102 104,124 132,124 C 154,124 170,110 176,95 L 152,95 C 148,102 140,106 131,106 C 117,106 106,94 106,80 C 106,66 117,54 131,54 C 141,54 149,59 153,65 Z" fill="#48a053"/>
    <!-- T (Red) -->
    <path d="M 185,38 L 245,38 L 245,58 L 226,58 L 226,120 L 204,120 L 204,58 L 185,58 Z" fill="#dc3c39"/>
  </g>

  <!-- Subtitle: THE CENTER OF COMMUNICATION -->
  <g transform="translate(0, 245)">
    <line x1="45" y1="-7" x2="105" y2="-7" stroke="#175475" stroke-width="1.8"/>
    <text x="300" y="0" text-anchor="middle" class="font-sub">THE CENTER OF COMMUNICATION</text>
    <line x1="495" y1="-7" x2="555" y2="-7" stroke="#175475" stroke-width="1.8"/>
  </g>
</svg>
